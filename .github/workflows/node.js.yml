name: NexaLearn CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # 3. Install dependencies (safe fallback for all projects)
      - name: Install dependencies
        run: npm install

      # 4. Run build (only if exists)
      - name: Build project
        run: npm run build --if-present

      # 5. Run tests (only if exists)
      - name: Run tests
        run: npm test --if-present
